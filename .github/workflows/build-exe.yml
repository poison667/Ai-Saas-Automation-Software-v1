name: Build Lumina.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]   # 64-bit AND 32-bit Windows builds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: pip install pyinstaller fastapi "uvicorn[standard]"

      - name: Build standalone exe
        run: >
          pyinstaller --onefile
          --name Lumina-${{ matrix.arch }}
          --icon desktop/icon.ico
          --add-data "static;static"
          --collect-submodules uvicorn
          --collect-submodules starlette
          server.py

      - name: Smoke test (boot server inside the exe)
        shell: pwsh
        run: |
          Start-Process -FilePath "dist\Lumina-${{ matrix.arch }}.exe" -WorkingDirectory dist
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Get-Process -Name "Lumina-${{ matrix.arch }}" -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "Smoke test failed: server did not respond" }
          Write-Host "Smoke test passed ✔"

      - uses: actions/upload-artifact@v4
        with:
          name: Lumina-${{ matrix.arch }}
          path: dist/Lumina-${{ matrix.arch }}.exe
          retention-days: 90
