name: Build Lumina desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64        # 64-bit Windows
            pyarch: x64
            ebflag: --x64
          - arch: x86        # 32-bit Windows
            pyarch: x86
            ebflag: --ia32
    steps:
      - uses: actions/checkout@v4

      # ---- 1. Compile the backend engine (Python -> single exe) ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.pyarch }}

      - name: Install backend deps
        run: pip install pyinstaller fastapi "uvicorn[standard]"

      - name: Compile backend exe
        run: >
          pyinstaller --onefile
          --name Lumina-backend
          --add-data "static;static"
          --collect-submodules uvicorn
          --collect-submodules starlette
          server.py

      - name: Smoke test backend (boot + health check)
        shell: pwsh
        run: |
          Start-Process -FilePath "dist\Lumina-backend.exe" -WorkingDirectory dist
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Get-Process -Name "Lumina-backend" -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "Backend smoke test failed" }
          Write-Host "Backend OK"

      # ---- 2. Wrap it in the native desktop window (Electron) ----
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Bundle backend into the app
        shell: pwsh
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force -Path backend | Out-Null
          Copy-Item ..\dist\Lumina-backend.exe backend\Lumina-backend.exe

      - name: Build portable desktop exe
        working-directory: desktop
        run: npx electron-builder --win portable ${{ matrix.ebflag }} --publish never

      - name: Normalize artifact name
        shell: pwsh
        working-directory: desktop/release
        run: |
          Get-ChildItem *.exe | ForEach-Object {
            $target = "Lumina-Desktop-${{ matrix.arch }}.exe"
            if ($_.Name -ne $target) { Rename-Item $_.FullName $target }
          }
          Get-ChildItem *.exe

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-app
          files: desktop/release/*.exe
